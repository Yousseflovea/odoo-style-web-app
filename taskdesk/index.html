<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>TaskDesk</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:#f5f7fb;color:#101828}.screen{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(520px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:28px;box-shadow:0 16px 45px rgba(16,24,40,.08);text-align:center}.logo{width:48px;height:48px;border-radius:14px;background:#101828;color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:24px}.muted{color:#667085}.error{display:none;text-align:right;background:#fef3f2;color:#b42318;padding:14px;border-radius:12px;margin-top:16px;white-space:pre-wrap}.spin{width:30px;height:30px;border:3px solid #e4e7ec;border-top-color:#2563eb;border-radius:50%;margin:22px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="screen"><div class="box"><div class="logo">✓</div><h1 style="margin:0">TaskDesk</h1><p class="muted">جاري تحميل التطبيق...</p><div class="spin"></div><div id="err" class="error"></div></div></div>
<script>
(async()=>{
  const err=document.getElementById('err');
  const fail=(m)=>{document.querySelector('.spin').style.display='none';err.style.display='block';err.textContent='تعذر تحميل TaskDesk.\n'+m+'\n\nأرسل صورة هذه الرسالة لي.'};
  try{
    const source='https://raw.githubusercontent.com/Yousseflovea/odoo-style-web-app/taskdesk-app/taskdesk.html?v='+Date.now();
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok) throw new Error('GitHub source HTTP '+r.status);
    let html=await r.text();
    if(!html.includes('TaskDesk')) throw new Error('ملف التطبيق غير صحيح');
    html=html.replace('<div id="root"></div>','<div id="root"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#f5f7fb"><div><b>TaskDesk</b><p>جاري التحميل...</p></div></div></div>');
    html=html.replace("<script type=\"module\">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';","<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\"></script><script>if(!window.supabase){document.getElementById('root').innerHTML='<div style=\\\"min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui\\\"><div><h2>TaskDesk</h2><p>تعذر تحميل مكتبة Supabase. جرّب شبكة أخرى أو أوقف مانع الإعلانات مؤقتًا.</p></div></div>';throw new Error('Supabase library unavailable')}const {createClient}=window.supabase;");
    document.open();document.write(html);document.close();
  }catch(e){fail(e?.message||String(e));}
})();
</script>
</body>
</html>
