<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TaskDesk</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,Arial;background:#f5f7fb;color:#0f172a}button,input,textarea,select{font:inherit}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 8px 25px #0f172a0d}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .card{width:min(430px,100%)}.brand{font-size:26px;font-weight:800}.muted{color:#64748b}.field{display:grid;gap:6px;margin:10px 0}.input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#0f172a;color:#fff}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{display:block;font-size:28px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #eef2f7}.row:last-child{border-bottom:0}.badge{padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px}.err{background:#fff1f2;color:#9f1239;padding:10px;border-radius:10px;margin:10px 0;white-space:pre-wrap}.toast{position:fixed;left:15px;bottom:15px;background:#0f172a;color:white;padding:11px 14px;border-radius:10px}.modalbg{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:16px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:18px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const BASE='https://rknmkwnlsaknmtwxupvf.supabase.co',KEY='sb_publishable_jeNI0OZSFYutImREvNNHFw_-JNnRf--',app=document.getElementById('app');let s=null,me=null,tasks=[],profiles=[],access=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=t=>{let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2500)};const modal=h=>{let d=document.createElement('div');d.className='modalbg';d.innerHTML='<div class="modal">'+h+'</div>';d.onclick=e=>{if(e.target===d)d.remove()};document.body.append(d);return d};function save(x){s=x;localStorage.setItem('td_s',JSON.stringify(x))}function loadS(){try{s=JSON.parse(localStorage.getItem('td_s')||'null')}catch{s=null}}function clear(){s=null;localStorage.removeItem('td_s')}async function api(path,o={}){let h={apikey:KEY,...o.headers};if(o.auth!==false&&s?.access_token)h.Authorization='Bearer '+s.access_token;let body=o.body;if(body!==undefined){h['Content-Type']='application/json';body=JSON.stringify(body)}let r=await fetch(BASE+path,{method:o.method||'GET',headers:h,body});let tx=await r.text(),d;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok)throw Error(d?.message||d?.msg||d?.error_description||d?.error||('HTTP '+r.status));return d}async function rest(t,q='',o={}){return api('/rest/v1/'+t+(q?'?'+q:''),o)}async function boot(){loadS();if(!s)return login();try{let p=await rest('profiles','id=eq.'+s.user.id+'&select=*');if(!p?.[0]){clear();return login('الحساب غير مفعّل')}me=p[0];await reload();home()}catch(e){login(e.message)}}function login(msg=''){app.innerHTML='<div class="auth"><div class="card"><div class="brand">✓ TaskDesk</div><p class="muted">تتبع تاسكات العمل والهيستوري والصلاحيات</p>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+'<form id="lf"><div class="field"><label>البريد</label><input class="input" name="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input class="input" name="password" type="password" required></div><button class="btn primary" style="width:100%">دخول</button></form><button id="fa" class="btn secondary" style="width:100%;margin-top:8px">إعداد أول Admin</button></div></div>';lf.onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:f.get('email'),password:f.get('password')}});x.expires_at=Math.floor(Date.now()/1000)+(x.expires_in||3600);save(x);boot()}catch(er){toast(er.message)}};fa.onclick=firstAdmin}function firstAdmin(){let m=modal('<h2>إنشاء أول Admin</h2><form id="ff"><div class="field"><label>الاسم</label><input class="input" name="name" required></div><div class="field"><label>البريد</label><input class="input" name="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input class="input" name="password" type="password" minlength="8" required></div><div class="field"><label>مفتاح الإعداد</label><input class="input" name="key" type="password" required></div><button class="btn primary">إنشاء</button></form>');m.querySelector('#ff').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/functions/v1/bootstrap-admin',{method:'POST',auth:false,body:{token:f.get('key'),email:f.get('email'),password:f.get('password'),full_name:f.get('name')}});m.remove();toast('تم إنشاء Admin');login()}catch(er){toast(er.message)}}}async function reload(){[profiles,tasks,access]=await Promise.all([rest('profiles','select=*&is_active=eq.true'),rest('tasks','select=*&archived=eq.false&order=updated_at.desc'),rest('task_access','select=*')])}function home(){let open=tasks.filter(x=>!['CLOSED','CANCELLED'].includes(x.status)).length;app.innerHTML='<div class="wrap"><div class="top"><div><div class="brand">TaskDesk</div><div class="muted">'+esc(me.full_name||me.email||'')+'</div></div><div><button id="new" class="btn primary">+ تاسك</button> <button id="team" class="btn secondary">الفريق</button> <button id="out" class="btn secondary">خروج</button></div></div><div class="grid"><div class="card stat">مفتوحة<b>'+open+'</b></div><div class="card stat">انتظار<b>'+tasks.filter(x=>x.status==='WAITING').length+'</b></div><div class="card stat">عاجلة<b>'+tasks.filter(x=>x.priority==='URGENT').length+'</b></div><div class="card stat">مغلقة<b>'+tasks.filter(x=>x.status==='CLOSED').length+'</b></div></div><div class="card"><div class="top"><h3>التاسكات</h3><input id="q" class="input" style="max-width:300px" placeholder="بحث..."></div><div id="list"></div></div></div>';document.getElementById('new').onclick=()=>taskForm();out.onclick=()=>{clear();me=null;login()};team.onclick=teamPage;q.oninput=renderList;renderList()}function renderList(){let q=(document.getElementById('q')?.value||'').toLowerCase(),ls=tasks.filter(x=>(x.title+' '+(x.description||'')).toLowerCase().includes(q));list.innerHTML=ls.length?ls.map(t=>'<div class="row" data-id="'+t.id+'"><div><b>#'+(t.task_number||'')+' '+esc(t.title)+'</b><div class="muted">'+esc((t.description||'').slice(0,100))+'</div></div><div><span class="badge">'+esc(t.status)+'</span> <span class="badge">'+esc(t.priority)+'</span></div></div>').join(''):'<div class="muted" style="padding:20px">لا توجد تاسكات</div>';document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>detail(r.dataset.id))}function canEdit(id){let t=tasks.find(x=>x.id===id);return me.role==='ADMIN'||t?.created_by===me.id||access.some(a=>a.task_id===id&&a.user_id===me.id&&a.access_level==='ASSIGNEE')}function taskForm(t=null){let m=modal('<h2>'+(t?'تعديل':'تاسك جديد')+'</h2><form id="tf"><div class="field"><label>العنوان</label><input class="input" name="title" required value="'+esc(t?.title||'')+'"></div><div class="field"><label>الوصف</label><textarea class="input" name="description" rows="3">'+esc(t?.description||'')+'</textarea></div><div class="field"><label>الحالة</label><select class="input" name="status">'+['NEW','IN_PROGRESS','WAITING','BLOCKED','RESOLVED','CLOSED','CANCELLED'].map(x=>'<option '+(t?.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>الأولوية</label><select class="input" name="priority">'+['LOW','MEDIUM','HIGH','URGENT'].map(x=>'<option '+(t?.priority===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><button class="btn primary">حفظ</button></form>');m.querySelector('#tf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),p={title:f.get('title'),description:f.get('description')||null,status:f.get('status'),priority:f.get('priority'),updated_by:me.id};try{if(t)await rest('tasks','id=eq.'+t.id,{method:'PATCH',headers:{Prefer:'return=representation'},body:p});else{p.created_by=me.id;p.start_date=new Date().toISOString().slice(0,10);await rest('tasks','',{method:'POST',headers:{Prefer:'return=representation'},body:p})}m.remove();await reload();home();toast('تم الحفظ')}catch(er){toast(er.message)}}}async function detail(id){let t=tasks.find(x=>x.id===id),edit=canEdit(id);app.innerHTML='<div class="wrap"><div class="top"><button id="back" class="btn secondary">رجوع</button>'+(edit?'<button id="edit" class="btn primary">تعديل</button>':'')+'</div><div class="card"><h2>'+esc(t.title)+'</h2><div class="muted">'+esc(t.description||'')+'</div><p><span class="badge">'+t.status+'</span> <span class="badge">'+t.priority+'</span></p></div><div class="card"><h3>التحليل / التشخيص / الحل</h3>'+(edit?'<form id="wf"><div class="field"><label>التحليل</label><textarea class="input" name="analysis" rows="3">'+esc(t.analysis||'')+'</textarea></div><div class="field"><label>التشخيص</label><textarea class="input" name="diagnosis" rows="3">'+esc(t.diagnosis||'')+'</textarea></div><div class="field"><label>الحل</label><textarea class="input" name="resolution" rows="3">'+esc(t.resolution||'')+'</textarea></div><button class="btn primary">حفظ</button></form>':'<p>'+esc(t.analysis||'—')+'</p><p>'+esc(t.diagnosis||'—')+'</p><p>'+esc(t.resolution||'—')+'</p>')+'</div><div class="card"><div class="top"><h3>الهيستوري</h3>'+(edit?'<button id="hist" class="btn secondary">+ حدث</button>':'')+'</div><div id="hb" class="muted">تحميل...</div></div></div>';back.onclick=home;if(edit){edit.onclick=()=>taskForm(t);wf.onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await rest('tasks','id=eq.'+id,{method:'PATCH',body:{analysis:f.get('analysis')||null,diagnosis:f.get('diagnosis')||null,resolution:f.get('resolution')||null,updated_by:me.id}});await reload();detail(id);toast('تم الحفظ')};hist.onclick=()=>histForm(id)}let h=await rest('task_history','task_id=eq.'+id+'&select=*&order=occurred_at.desc');hb.innerHTML=h.length?h.map(x=>'<div class="row"><div><b>'+esc(x.title)+'</b><div>'+esc(x.details||'')+'</div></div><small>'+new Date(x.occurred_at).toLocaleString('ar-KW')+'</small></div>').join(''):'لا يوجد هيستوري'}function histForm(id){let m=modal('<h2>إضافة حدث</h2><form id="hf"><div class="field"><label>العنوان</label><input class="input" name="title" required></div><div class="field"><label>التفاصيل</label><textarea class="input" name="details"></textarea></div><button class="btn primary">إضافة</button></form>');m.querySelector('#hf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await rest('task_history','',{method:'POST',body:{task_id:id,event_type:'NOTE',title:f.get('title'),details:f.get('details')||null,created_by:me.id}});m.remove();detail(id);toast('تمت الإضافة')}}function teamPage(){app.innerHTML='<div class="wrap"><div class="top"><button id="back" class="btn secondary">رجوع</button>'+(me.role==='ADMIN'?'<button id="invite" class="btn primary">دعوة مستخدم</button>':'')+'</div><div class="card"><h2>الفريق</h2>'+profiles.map(p=>'<div class="row"><div><b>'+esc(p.full_name||p.email||p.id)+'</b><div class="muted">'+esc(p.email||'')+'</div></div><span class="badge">'+esc(p.role||'MEMBER')+'</span></div>').join('')+'</div></div>';back.onclick=home;if(me.role==='ADMIN')invite.onclick=inviteForm}function inviteForm(){let m=modal('<h2>دعوة مستخدم</h2><form id="iv"><div class="field"><label>الاسم</label><input class="input" name="name" required></div><div class="field"><label>البريد</label><input class="input" type="email" name="email" required></div><button class="btn primary">إرسال</button></form>');m.querySelector('#iv').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/functions/v1/invite-user',{method:'POST',body:{email:f.get('email'),full_name:f.get('name')}});m.remove();toast('تم إرسال الدعوة')}catch(er){toast(er.message)}}}boot()})();
</script></body></html>
