name: Deploy Shahnaty + TaskDesk to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v6

      - name: Checkout TaskDesk source branch
        uses: actions/checkout@v6
        with:
          ref: taskdesk-app
          path: .taskdesk-source

      - name: Prepare TaskDesk route
        shell: bash
        run: |
          mkdir -p taskdesk
          cp .taskdesk-source/taskdesk.html taskdesk/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('taskdesk/index.html')
          s = p.read_text()
          s = s.replace('<div id="root"></div>', '<div id="root"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui"><div style="text-align:center"><strong style="font-size:24px">TaskDesk</strong><p>جاري تحميل التطبيق...</p></div></div></div>')
          s = s.replace("<script type=\"module\">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';", "<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2\"></script><script>const {createClient}=window.supabase;")
          p.write_text(s)
          PY
          rm -rf .taskdesk-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
